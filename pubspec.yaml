name: rz_kharch_diary
description: "Rz Kharch Diary - Offline daily expense tracker with PDF export, multi-language support, and daily reminders"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_mobile_ads: ^5.2.0
  pdf: ^3.10.8
  printing: ^5.12.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "ic_launcher_rz.png"
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: "ic_launcher_rz.png"
  

name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Structure
        run: flutter create . --platforms=android

      - name: Configure AdMob App ID & Fix Gradle Compatibility
        run: |
          python3 -c '
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")
          meta = ET.SubElement(app, "meta-data")
          meta.set("{http://schemas.android.com/apk/res/android}name", "com.google.android.gms.ads.APPLICATION_ID")
          meta.set("{http://schemas.android.com/apk/res/android}value", "ca-app-pub-3940256099942544~3347511713")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          '
          # Fix missing namespace and gradle 8 issues for older plugins
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # Inject subprojects fix into root build.gradle
          python3 -c '
          path = "android/build.gradle"
          with open(path, "a") as f:
              f.write("""
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      if (project.android.namespace == null) {
                          project.android.namespace = project.group
                      }
                  }
              }
          }
          """)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-expense-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          

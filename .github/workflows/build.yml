name: Generate Play Store AAB

on:
  workflow_dispatch:

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Setup Android & Force Kotlin 1.9.22
        run: |
          # Fresh android structure generate karein
          flutter create --project-name expense_tracker --platforms=android .
          
          # Gradle wrapper ko 8.4 par set karein
          sed -i 's/gradle-.*-all.zip/gradle-8.4-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true
          sed -i 's/gradle-.*-bin.zip/gradle-8.4-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true

          # Python se build.gradle me Kotlin 1.9.22 aur minSdkVersion 21 force karein
          python3 -c "
          import re
          # Update android/build.gradle
          with open('android/build.gradle', 'r') as f:
              content = f.read()
          content = re.sub(r\"ext\.kotlin_version\s*=\s*['\"][^'\"]+['\"]\", \"ext.kotlin_version = '1.9.22'\", content)
          if 'ext.kotlin_version' not in content:
              content = \"buildscript { ext.kotlin_version = '1.9.22' }\n\" + content
          with open('android/build.gradle', 'w') as f:
              f.write(content)

          # Update android/app/build.gradle
          with open('android/app/build.gradle', 'r') as f:
              app_content = f.read()
          app_content = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 21', app_content)
          app_content = re.sub(r'minSdkVersion\s*=\s*.*', 'minSdkVersion = 21', app_content)
          with open('android/app/build.gradle', 'w') as f:
              f.write(app_content)
          "

          flutter pub get

      - name: Build Android App Bundle (.aab)
        run: flutter build appbundle --release --no-shrink

      - name: Save AAB File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KharchDiary-Release-AAB
          path: build/app/outputs/bundle/release/*.aab
          

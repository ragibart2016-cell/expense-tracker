name: Generate Play Store AAB

on:
  workflow_dispatch:

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Recreate Android Project Config
        run: |
          flutter create --project-name expense_tracker --platforms=android .
          flutter pub get

      - name: Build Android App Bundle (.aab)
        run: flutter build appbundle --release --no-shrink

      - name: Save AAB File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KharchDiary-Release-AAB
          path: build/app/outputs/bundle/release/*.aab
          

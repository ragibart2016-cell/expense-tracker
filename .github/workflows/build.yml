          8s2bFxf7N+9W1fXlh5eXq1e3D5er7v9eXf7x/f2ri+7/1t2n1evd1fX++qfLF7s/L/7y4Uf7
          U/3910+Xq4vV1f6f1f51/eG71a+X+8/fVf/5ev3+/59//tG+r77/5/5i/+r63eW3+/3H3e7f
          /4c=
          '''
          code = zlib.decompress(base64.b64decode(raw.strip())).decode('utf-8')
          with open('lib/main.dart', 'w') as f:
              f.write(code)
          "

      - name: Setup Native Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          convert ic_launcher.png -resize 108x108! android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          convert ic_launcher.png -resize 48x48! android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert ic_launcher.png -resize 162x162! android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          convert ic_launcher.png -resize 72x72! android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert ic_launcher.png -resize 216x216! android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          convert ic_launcher.png -resize 96x96! android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert ic_launcher.png -resize 324x324! android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          convert ic_launcher.png -resize 144x144! android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert ic_launcher.png -resize 432x432! android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          convert ic_launcher.png -resize 192x192! android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:color="@android:color/white"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Configure App Details
        run: |
          sed -i 's/android:label="expense_tracker"/android:label="Kharch Diary"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<\/application>/<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6500268418138615~1903722153"\/><\/application>/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-expense-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          

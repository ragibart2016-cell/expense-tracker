name: Build and Sign Kharch Diary

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Compliant Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Locate Flutter Project Directory
        id: find_dir
        run: |
          PROJECT_DIR=$(dirname $(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1))
          echo "Found project directory at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Migrate Project to V2 Embedding
        working-directory: ${{ steps.find_dir.outputs.dir }}
        run: |
          python3 -c "
          import os

          # 1. Update AndroidManifest.xml
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file == 'AndroidManifest.xml' and 'src/main' in root:
                      p = os.path.join(root, file)
                      with open(p, 'r', encoding='utf-8') as f:
                          content = f.read()
                      if 'flutterEmbedding' not in content:
                          tag = '<meta-data android:name=\"flutterEmbedding\" android:value=\"2\" />'
                          content = content.replace('<application', '<application>\n        ' + tag, 1)
                          with open(p, 'w', encoding='utf-8') as f:
                              f.write(content)
                          print(f'Updated {p}')

          # 2. Update MainActivity.kt / MainActivity.java
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file == 'MainActivity.kt':
                      p = os.path.join(root, file)
                      with open(p, 'w', encoding='utf-8') as f:
                          f.write('package com.rzapps.kharchdiary\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity: FlutterActivity() {\n}\n')
                      print(f'Updated {p}')
                  elif file == 'MainActivity.java':
                      p = os.path.join(root, file)
                      with open(p, 'w', encoding='utf-8') as f:
                          f.write('package com.rzapps.kharchdiary;\n\nimport io.flutter.embedding.android.FlutterActivity;\n\npublic class MainActivity extends FlutterActivity {\n}\n')
                      print(f'Updated {p}')
          "

      - name: Generate Fresh Keystore and Upload Certificate
        working-directory: ${{ steps.find_dir.outputs.dir }}
        run: |
          TARGET_DIR="android/app"
          mkdir -p "$TARGET_DIR"
          keytool -genkeypair \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore "$TARGET_DIR/upload-keystore.jks" \
            -storepass "KharchDiary@2026" \
            -keypass "KharchDiary@2026" \
            -dname "CN=Rz Apps, OU=Mobile, O=Rz Apps, L=Bijnor, ST=UP, C=IN"

          keytool -export -rfc \
            -keystore "$TARGET_DIR/upload-keystore.jks" \
            -alias upload \
            -storepass "KharchDiary@2026" \
            -file upload_cert.pem

      - name: Install Flutter Dependencies
        working-directory: ${{ steps.find_dir.outputs.dir }}
        run: flutter pub get

      - name: Build Android App Bundle (AAB)
        working-directory: ${{ steps.find_dir.outputs.dir }}
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload Compliant AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Kharch-Diary-Release-AAB
          path: ${{ steps.find_dir.outputs.dir }}/build/app/outputs/bundle/release/app-release.aab

      - name: Upload Play Console Certificate (.pem)
        uses: actions/upload-artifact@v4
        with:
          name: Upload-Certificate-PEM
          path: ${{ steps.find_dir.outputs.dir }}/upload_cert.pem
          

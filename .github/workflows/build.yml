name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Create Android Structure
        run: flutter create . --project-name expense_tracker --platforms=android

      - name: Generate Clean Feature-Loaded main.dart
        run: |
          python3 -c "
          import zlib, base64
          raw = '''eJytWV1v2zYUfZ9f4e2w1FisIsvy28o0G2o07ZZmwbYhTQsMwbBk20wkUuGocbr23/tSiZJMSXYG
          YF1u1FPi83LP4dxzL+XF698Wk0q/V612Xyq1mKq/VGrb7fbV23a3+6v6U5/8X7Xo/25+0b3n
          t/3u3R/dt/3+z3d395/3VfvN7e1/2vdXdx8qdb3p/r3v1/1Vb/e2v9z2f73vHlTVtN3/2d2o
          drN9+7b/81f1S/Vztdn919v76u42U9505lG77x9U9f3u1/5196r7vP/T3XkrvKje9N+2u3a/
          7e73d3f11d13Z9+394P723ff/2zfrqeq9467+8vVvjV1b09xW6v5pLqqm9fV9V+Xqrq+rF5+

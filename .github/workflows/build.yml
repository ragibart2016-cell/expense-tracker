name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Create Android Structure
        run: flutter create . --project-name expense_tracker --platforms=android

      - name: Setup Flutter Launcher Icons & Generate Perfect Icons
        run: |
          cat << 'EOF' > generate_icons.py
          import yaml
          import os

          # Update pubspec.yaml with flutter_launcher_icons
          with open("pubspec.yaml", "r") as f:
              content = f.read()

          if "flutter_launcher_icons" not in content:
              config = """
          dev_dependencies:
            flutter_launcher_icons: "^0.13.1"

          flutter_launcher_icons:
            android: "launcher_icon"
            ios: false
            image_path: "ic_launcher.png"
            min_sdk_android: 21
            adaptive_icon_background: "#FFFFFF"
            adaptive_icon_foreground: "ic_launcher.png"
          """
              content += config
              with open("pubspec.yaml", "w") as f:
                  f.write(content)
          EOF
          python3 generate_icons.py
          flutter pub get
          dart run flutter_launcher_icons

      - name: Set App Name & Manifest Icon
        run: |
          sed -i 's/android:label="expense_tracker"/android:label="Kharch Diary"/g' android/app/src/main/AndroidManifest.xml
          # Ensure manifest points to the new adaptive icon
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/launcher_icon"/g' android/app/src/main/AndroidManifest.xml

      - name: Fix Kotlin, MinSDK and AdMob ID
        run: |
          cat << 'EOF' > fix_setup.py
          import xml.etree.ElementTree as ET
          import re

          # 1. AdMob App ID
          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")
          meta = ET.SubElement(app, "meta-data")
          meta.set("{http://schemas.android.com/apk/res/android}name", "com.google.android.gms.ads.APPLICATION_ID")
          meta.set("{http://schemas.android.com/apk/res/android}value", "ca-app-pub-6500268418138615~1903722153")
          tree.write(path, encoding="utf-8", xml_declaration=True)

          # 2. Overwrite root build.gradle
          root_gradle = """allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          """
          with open("android/build.gradle", "w") as f:
              f.write(root_gradle)

          # 3. Settings.gradle plugin version fix
          with open("android/settings.gradle", "r") as f:
              settings_data = f.read()
          settings_data = re.sub(r'org\.jetbrains\.kotlin\.android\"version\s*[\'\"][^\'\"]*[\'\"]', 'org.jetbrains.kotlin.android" version "1.9.20"', settings_data)
          settings_data = re.sub(r'id\s+[\'\"]org\.jetbrains\.kotlin\.android[\'\"]\s+version\s+[\'\"][^\'\"]*[\'\"]', 'id "org.jetbrains.kotlin.android" version "1.9.20"', settings_data)
          with open("android/settings.gradle", "w") as f:
              f.write(settings_data)

          # 4. MinSDK 21
          with open("android/app/build.gradle", "r") as f:
              app_data = f.read()
          app_data = app_data.replace("minSdkVersion = flutter.minSdkVersion", "minSdkVersion = 21")
          app_data = app_data.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
          with open("android/app/build.gradle", "w") as f:
              f.write(app_data)
          EOF
          python3 fix_setup.py

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-expense-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          

name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Create Android Structure
        run: flutter create . --project-name expense_tracker --platforms=android

      - name: Download Full Feature main.dart
        run: |
          curl -sL "https://raw.githubusercontent.com/ragibart2016-cell/expense-tracker/main/lib/main.dart" > lib/main.dart.bak || true
          curl -sL "https://gist.githubusercontent.com/ragibart2016-cell/f6d729a8c17b5fba45c7adcf360706fe/raw/main.dart" -o lib/main.dart || true
          if [ ! -s lib/main.dart ]; then
            python3 -c "
import urllib.request
url = 'https://pastebin.com/raw/d8uF2yKx'
req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
try:
    content = urllib.request.urlopen(req).read().decode('utf-8')
    with open('lib/main.dart', 'w') as f:
        f.write(content)
except Exception:
    pass
"
          fi

      - name: Generate Native Adaptive Launcher Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          python3 - << 'EOF'
          import os
          import subprocess

          densities = {
              "mipmap-mdpi": (108, 48),
              "mipmap-hdpi": (162, 72),
              "mipmap-xhdpi": (216, 96),
              "mipmap-xxhdpi": (324, 144),
              "mipmap-xxxhdpi": (432, 192)
          }

          res_dir = "android/app/src/main/res"

          for folder, (fg_size, leg_size) in densities.items():
              target_folder = os.path.join(res_dir, folder)
              os.makedirs(target_folder, exist_ok=True)
              
              subprocess.run([
                  "convert", "ic_launcher.png",
                  "-resize", f"{fg_size}x{fg_size}!",
                  os.path.join(target_folder, "ic_launcher_foreground.png")
              ], check=True)
              
              subprocess.run([
                  "convert", "ic_launcher.png",
                  "-resize", f"{leg_size}x{leg_size}!",
                  os.path.join(target_folder, "ic_launcher.png")
              ], check=True)

          v26_folder = os.path.join(res_dir, "mipmap-anydpi-v26")
          os.makedirs(v26_folder, exist_ok=True)

          xml_content = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:color="@android:color/white"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          """

          with open(os.path.join(v26_folder, "ic_launcher.xml"), "w") as f:
              f.write(xml_content.strip())
          EOF

      - name: Set App Name
        run: |
          sed -i 's/android:label="expense_tracker"/android:label="Kharch Diary"/g' android/app/src/main/AndroidManifest.xml

      - name: Fix Kotlin, MinSDK and AdMob ID
        run: |
          cat << 'EOF' > fix_setup.py
          import xml.etree.ElementTree as ET
          import re

          # 1. AdMob App ID
          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")
          meta = ET.SubElement(app, "meta-data")
          meta.set("{http://schemas.android.com/apk/res/android}name", "com.google.android.gms.ads.APPLICATION_ID")
          meta.set("{http://schemas.android.com/apk/res/android}value", "ca-app-pub-6500268418138615~1903722153")
          tree.write(path, encoding="utf-8", xml_declaration=True)

          # 2. Overwrite root build.gradle
          root_gradle = """allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          """
          with open("android/build.gradle", "w") as f:
              f.write(root_gradle)

          # 3. Settings.gradle plugin version fix
          with open("android/settings.gradle", "r") as f:
              settings_data = f.read()
          settings_data = re.sub(r'org\.jetbrains\.kotlin\.android\"version\s*[\'\"][^\'\"]*[\'\"]', 'org.jetbrains.kotlin.android" version "1.9.20"', settings_data)
          settings_data = re.sub(r'id\s+[\'\"]org\.jetbrains\.kotlin\.android[\'\"]\s+version\s+[\'\"][^\'\"]*[\'\"]', 'id "org.jetbrains.kotlin.android" version "1.9.20"', settings_data)
          with open("android/settings.gradle", "w") as f:
              f.write(settings_data)

          # 4. MinSDK 21
          with open("android/app/build.gradle", "r") as f:
              app_data = f.read()
          app_data = app_data.replace("minSdkVersion = flutter.minSdkVersion", "minSdkVersion = 21")
          app_data = app_data.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
          with open("android/app/build.gradle", "w") as f:
              f.write(app_data)
          EOF
          python3 fix_setup.py

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-expense-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          

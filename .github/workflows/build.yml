name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Create Android Structure
        run: flutter create . --project-name expense_tracker --platforms=android

      - name: Patch AdMob, MinSDK and Kotlin Version
        run: |
          python3 -c '
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")
          meta = ET.SubElement(app, "meta-data")
          meta.set("{http://schemas.android.com/apk/res/android}name", "com.google.android.gms.ads.APPLICATION_ID")
          meta.set("{http://schemas.android.com/apk/res/android}value", "ca-app-pub-6588358418138815~1983722153")
          tree.write(path, encoding="utf-8", xml_declaration=True)

          # Force Kotlin 1.9.20
          with open("android/build.gradle", "r") as f:
              content = f.read()
          import re
          content = re.sub(r"ext\.kotlin_version\s*=\s*[\x27\x22][^\x27\x22]+[\x27\x22]", "ext.kotlin_version = \x271.9.20\x27", content)
          content = re.sub(r"kotlin-gradle-plugin:[0-9\.]+", "kotlin-gradle-plugin:1.9.20", content)
          with open("android/build.gradle", "w") as f:
              f.write(content)

          # Force minSdkVersion 21
          with open("android/app/build.gradle", "r") as f:
              app_content = f.read()
          app_content = app_content.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
          app_content = app_content.replace("minSdkVersion = flutter.minSdkVersion", "minSdkVersion = 21")
          with open("android/app/build.gradle", "w") as f:
              f.write(app_content)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-expense-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          

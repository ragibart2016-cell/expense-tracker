name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Create Android Structure
        run: flutter create . --project-name expense_tracker --platforms=android

      - name: Generate Native Adaptive Launcher Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          python3 -c "
import os, subprocess
densities = {'mipmap-mdpi': (108, 48), 'mipmap-hdpi': (162, 72), 'mipmap-xhdpi': (216, 96), 'mipmap-xxhdpi': (324, 144), 'mipmap-xxxhdpi': (432, 192)}
res_dir = 'android/app/src/main/res'
for folder, (fg, leg) in densities.items():
    p = os.path.join(res_dir, folder)
    os.makedirs(p, exist_ok=True)
    subprocess.run(['convert', 'ic_launcher.png', '-resize', f'{fg}x{fg}!', os.path.join(p, 'ic_launcher_foreground.png')], check=True)
    subprocess.run(['convert', 'ic_launcher.png', '-resize', f'{leg}x{leg}!', os.path.join(p, 'ic_launcher.png')], check=True)
v26 = os.path.join(res_dir, 'mipmap-anydpi-v26')
os.makedirs(v26, exist_ok=True)
with open(os.path.join(v26, 'ic_launcher.xml'), 'w') as f:
    f.write('<?xml version=\"1.0\" encoding=\"utf-8\"?>\\n<adaptive-icon xmlns:android=\"http://schemas.android.com/apk/res/android\">\\n    <background android:color=\"@android:color/white\"/>\\n    <foreground android:drawable=\"@mipmap/ic_launcher_foreground\"/>\\n</adaptive-icon>')
"

      - name: Set App Name
        run: |
          sed -i 's/android:label="expense_tracker"/android:label="Kharch Diary"/g' android/app/src/main/AndroidManifest.xml

      - name: Fix Kotlin, MinSDK and AdMob ID
        run: |
          python3 -c "
import xml.etree.ElementTree as ET, re
path = 'android/app/src/main/AndroidManifest.xml'
ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
tree = ET.parse(path)
app = tree.getroot().find('application')
meta = ET.SubElement(app, 'meta-data')
meta.set('{http://schemas.android.com/apk/res/android}name', 'com.google.android.gms.ads.APPLICATION_ID')
meta.set('{http://schemas.android.com/apk/res/android}value', 'ca-app-pub-6500268418138615~1903722153')
tree.write(path, encoding='utf-8', xml_declaration=True)

with open('android/build.gradle', 'w') as f:
    f.write('allprojects { repositories { google(); mavenCentral() } }\\nrootProject.buildDir = \"../build\"\\nsubprojects { project.buildDir = \"${rootProject.buildDir}/${project.name}\"; project.evaluationDependsOn(\":app\") }\\ntasks.register(\"clean\", Delete) { delete rootProject.buildDir }\\n')

with open('android/settings.gradle', 'r') as f:
    s = f.read()
s = re.sub(r'org\.jetbrains\.kotlin\.android\"version\s*[\'\"][^\'\"]*[\'\"]', 'org.jetbrains.kotlin.android\" version \"1.9.20\"', s)
s = re.sub(r'id\s+[\'\"]org\.jetbrains\.kotlin\.android[\'\"]\s+version\s+[\'\"][^\'\"]*[\'\"]', 'id \"org.jetbrains.kotlin.android\" version \"1.9.20\"', s)
with open('android/settings.gradle', 'w') as f:
    f.write(s)

with open('android/app/build.gradle', 'r') as f:
    a = f.read()
a = a.replace('minSdkVersion = flutter.minSdkVersion', 'minSdkVersion = 21').replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
with open('android/app/build.gradle', 'w') as f:
    f.write(a)
"

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-expense-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          

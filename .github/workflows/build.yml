name: Build and Sign Kharch Diary

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Compliant Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Generate Fresh Keystore and Upload Certificate
        run: |
          mkdir -p android/app
          keytool -genkeypair \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore android/app/upload-keystore.jks \
            -storepass "KharchDiary@2026" \
            -keypass "KharchDiary@2026" \
            -dname "CN=Rz Apps, OU=Mobile, O=Rz Apps, L=Bijnor, ST=UP, C=IN"

          keytool -export -rfc \
            -keystore android/app/upload-keystore.jks \
            -alias upload \
            -storepass "KharchDiary@2026" \
            -file upload_cert.pem

      - name: Configure Clean Signing in Gradle
        run: |
          cat << 'EOF' > android/app/build.gradle.tmp
          android {
              signingConfigs {
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword 'KharchDiary@2026'
                      keyAlias 'upload'
                      keyPassword 'KharchDiary@2026'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          EOF

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload Compliant AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Kharch-Diary-Release-AAB
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Play Console Certificate (.pem)
        uses: actions/upload-artifact@v4
        with:
          name: Upload-Certificate-PEM
          path: upload_cert.pem
          

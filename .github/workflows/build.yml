name: Build and Sign Kharch Diary

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Compliant Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Migrate Android Embedding to V2
        run: |
          # 1. Update AndroidManifest.xml for V2 embedding
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "flutterEmbedding" "$MANIFEST"; then
            sed -i '/<application/a \        <meta-data android:name="flutterEmbedding" android:value="2" />' "$MANIFEST"
          fi

          # 2. Convert MainActivity to modern FlutterActivity (V2)
          MAIN_ACTIVITY_JAVA=$(find android/app/src/main/java -name "MainActivity.java" 2>/dev/null || true)
          MAIN_ACTIVITY_KT=$(find android/app/src/main/kotlin -name "MainActivity.kt" 2>/dev/null || true)

          if [ -n "$MAIN_ACTIVITY_JAVA" ]; then
            cat << 'EOF' > "$MAIN_ACTIVITY_JAVA"
package com.rzapps.kharchdiary;

import io.flutter.embedding.android.FlutterActivity;

public class MainActivity extends FlutterActivity {
}
EOF
          fi

          if [ -n "$MAIN_ACTIVITY_KT" ]; then
            cat << 'EOF' > "$MAIN_ACTIVITY_KT"
package com.rzapps.kharchdiary

import io.flutter.embedding.android.FlutterActivity

class MainActivity: FlutterActivity() {
}
EOF
          fi

      - name: Generate Fresh Keystore and Upload Certificate
        run: |
          mkdir -p android/app
          keytool -genkeypair \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore android/app/upload-keystore.jks \
            -storepass "KharchDiary@2026" \
            -keypass "KharchDiary@2026" \
            -dname "CN=Rz Apps, OU=Mobile, O=Rz Apps, L=Bijnor, ST=UP, C=IN"

          keytool -export -rfc \
            -keystore android/app/upload-keystore.jks \
            -alias upload \
            -storepass "KharchDiary@2026" \
            -file upload_cert.pem

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload Compliant AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Kharch-Diary-Release-AAB
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Play Console Certificate (.pem)
        uses: actions/upload-artifact@v4
        with:
          name: Upload-Certificate-PEM
          path: upload_cert.pem
          

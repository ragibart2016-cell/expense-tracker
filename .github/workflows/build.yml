name: Generate Play Store AAB

on:
  workflow_dispatch:

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Configure Android Project & Force Kotlin 1.9.22
        run: |
          # Fresh android structure generate karein
          flutter create --project-name expense_tracker --platforms=android .
          
          # minSdkVersion ko 21 karein
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          
          # build.gradle ke andar Kotlin version 1.9.22 enforce karein
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/g" android/build.gradle || true
          
          # settings.gradle me agar id("org.jetbrains.kotlin.android") ho to version override karein
          sed -i 's/id "org.jetbrains.kotlin.android" version .*/id "org.jetbrains.kotlin.android" version "1.9.22" apply false/g' android/settings.gradle || true
          sed -i 's/id "com.android.application" version .*/id "com.android.application" version "8.1.0" apply false/g' android/settings.gradle || true

          flutter pub get

      - name: Build Android App Bundle (.aab)
        run: flutter build appbundle --release --no-shrink

      - name: Save AAB File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KharchDiary-Release-AAB
          path: build/app/outputs/bundle/release/*.aab
          

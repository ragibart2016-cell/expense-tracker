name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Structure
        run: flutter create . --platforms=android

      - name: Configure AdMob App ID
        run: |
          python3 -c '
          import os
          path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()
              ad_tag = "\n        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\"/>\n"
              if "<application" in content:
                  content = content.replace("<application", "<application" + ad_tag, 1)
                  with open(path, "w") as f:
                      f.write(content)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-expense-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          

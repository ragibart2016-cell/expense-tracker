name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Create Android Structure
        run: flutter create . --project-name expense_tracker --platforms=android

      - name: Fix Kotlin, SDK and AdMob
        run: |
          sed -i 's/targetSdkVersion = flutter.targetSdkVersion/targetSdkVersion = 34/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion = flutter.compileSdkVersion/compileSdkVersion = 34/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.20"/g' android/build.gradle || true
          sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.20"/g' android/settings.gradle || true
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.20"/g' android/settings.gradle || true

          sed -i 's/<\/application>/<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6500268418138615~1903722153"\/><\/application>/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="expense_tracker"/android:label="Kharch Diary"/g' android/app/src/main/AndroidManifest.xml

      - name: Generate Official Android Icons
        run: |
          # 1. Clean out default Flutter placeholders
          rm -rf android/app/src/main/res/mipmap-*
          rm -rf android/app/src/main/res/drawable/launch_background.xml || true

          # 2. Add flutter_launcher_icons package
          flutter pub add --dev flutter_launcher_icons

          # 3. Configure adaptive icon with exact centered padding
          cat << 'EOF' >> pubspec.yaml

          flutter_launcher_icons:
            android: "launcher_icon"
            image_path: "ic_launcher.png"
            adaptive_icon_background: "#FFFFFF"
            adaptive_icon_foreground: "ic_launcher.png"
            min_sdk_android: 21
          EOF

          # 4. Generate all density layers & adaptive XML
          flutter pub run flutter_launcher_icons

          # 5. Point AndroidManifest directly to the newly generated icon
          sed -i 's/android:icon="[^"]*"/android:icon="@mipmap\/launcher_icon" android:roundIcon="@mipmap\/launcher_icon"/g' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-expense-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          

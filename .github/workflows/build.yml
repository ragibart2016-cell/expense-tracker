name: Generate Play Store AAB

on:
  workflow_dispatch:

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: "stable"

      - name: Recreate Android Project & Configure Release Signing
        run: |
          # Fresh android structure
          flutter create --org com.rzapps --project-name kharchdiary --platforms=android .

          # Committed Keystore ko android/app me copy karein
          cp upload-keystore.jks android/app/upload-keystore.jks

          # 1. Gradle Wrapper 8.4
          sed -i 's/gradle-.*-all.zip/gradle-8.4-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true
          sed -i 's/gradle-.*-bin.zip/gradle-8.4-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true

          # 2. settings.gradle me modern kotlin plugin version 1.9.22 set karein
          cat << 'EOF' > android/settings.gradle
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null : "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.3.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }

          include ":app"
          EOF

          # 3. android/key.properties banayein
          cat << 'EOF' > android/key.properties
          storePassword=kharchdiary123
          keyPassword=kharchdiary123
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

          # 4. android/app/build.gradle update karein (Version 4 / 1.0.3)
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace = "com.rzapps.kharchdiary"
              compileSdk = 36
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              defaultConfig {
                  applicationId = "com.rzapps.kharchdiary"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 4
                  versionName = "1.0.3"
              }

              signingConfigs {
                  release {
                      keyAlias = keystoreProperties['keyAlias']
                      keyPassword = keystoreProperties['keyPassword']
                      storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword = keystoreProperties['storePassword']
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.release
                      minifyEnabled = false
                      shrinkResources = false
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

          # 5. AdMob App ID ko AndroidManifest.xml me add karein
          sed -i '/<application/a \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4566358418138615~1083723153"/>' android/app/src/main/AndroidManifest.xml

          flutter pub get

      - name: Build Android App Bundle (.aab)
        run: flutter build appbundle --release --no-shrink

      - name: Save AAB File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KharchDiary-Release-AAB
          path: build/app/outputs/bundle/release/*.aab
          

name: Generate Play Store AAB

on:
  workflow_dispatch:

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Recreate Android Project & Force Modern Kotlin
        run: |
          # Fresh android structure generate karein
          flutter create --project-name expense_tracker --platforms=android .

          # 1. Gradle Wrapper 8.4
          sed -i 's/gradle-.*-all.zip/gradle-8.4-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true
          sed -i 's/gradle-.*-bin.zip/gradle-8.4-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true

          # 2. android/settings.gradle me modern Kotlin plugin version 1.9.22 set karein
          cat << 'EOF' > android/settings.gradle
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null : "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.3.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }

          include ":app"
          EOF

          # 3. minSdkVersion 21 set karein
          sed -i "s/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g" android/app/build.gradle || true
          sed -i "s/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g" android/app/build.gradle || true

          flutter pub get

      - name: Build Android App Bundle (.aab)
        run: flutter build appbundle --release --no-shrink

      - name: Save AAB File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KharchDiary-Release-AAB
          path: build/app/outputs/bundle/release/*.aab
          
